<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Elbo Records</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header>
    <div class="header-inner">
      <div class="header-top">
        <div class="logo">
          <span class="logo-mark">◈</span>
          <h1>Elbo Records</h1>
        </div>
        <button class="cart-btn" id="cart-btn" aria-label="Shopping cart">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/>
            <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/>
          </svg>
          <span class="cart-count" id="cart-count" hidden>0</span>
        </button>
      </div>
      <p class="tagline">San Diego · Vinyl · Analog · Collectibles</p>
      <nav class="filters">
        <button class="filter-btn active" data-filter="all">All</button>
        <button class="filter-btn" data-filter="vinyl">Vinyl</button>
        <button class="filter-btn" data-filter="cds">CDs</button>
        <button class="filter-btn" data-filter="gear">Gear</button>
        <!-- <button class="filter-btn" data-filter="collectibles">Collectibles</button> -->
      </nav>
    </div>
  </header>

  <main>
    <div id="catalog-grid" class="catalog-grid"></div>
    <p id="empty-msg" class="empty-msg" style="display:none">No items found.</p>
  </main>

  <!-- Cart drawer -->
  <div id="cart-overlay" class="cart-overlay" aria-hidden="true"></div>
  <aside id="cart-drawer" class="cart-drawer" aria-label="Shopping cart">
    <div class="cart-header">
      <h2>Cart</h2>
      <button class="cart-close" id="cart-close" aria-label="Close cart">&times;</button>
    </div>
    <div id="cart-items" class="cart-items"></div>
    <div class="cart-footer" id="cart-footer" style="display:none">
      <div class="cart-total">
        <span>Total</span>
        <span id="cart-total-price"></span>
      </div>
      <button class="checkout-btn" id="checkout-btn">Checkout via PayPal</button>
      <form id="paypal-cart-form" action="https://www.paypal.com/cgi-bin/webscr" method="post" target="_blank" style="display:none"></form>
    </div>
    <p class="cart-empty-msg" id="cart-empty-msg">Your cart is empty.</p>
  </aside>

  <!-- Item detail modal -->
  <div id="modal-overlay" class="modal-overlay" aria-hidden="true">
    <div class="modal" role="dialog" aria-modal="true">
      <button class="modal-close" id="modal-close" aria-label="Close">&times;</button>
      <div class="modal-body">
        <div class="modal-image-wrap">
          <img id="modal-img" src="" alt="">
          <div id="modal-sold-badge" class="modal-sold-badge" style="display:none">SOLD</div>
        </div>
        <div class="modal-details">
          <p id="modal-format" class="modal-format"></p>
          <h2 id="modal-title"></h2>
          <p id="modal-artist" class="modal-artist"></p>
          <div class="modal-meta">
            <div id="modal-label-row" class="meta-row" style="display:none">
              <span class="meta-label">Label</span>
              <span id="modal-label"></span>
            </div>
            <div id="modal-year-row" class="meta-row" style="display:none">
              <span class="meta-label">Year</span>
              <span id="modal-year"></span>
            </div>
            <div id="modal-media-row" class="meta-row" style="display:none">
              <span class="meta-label">Media</span>
              <span id="modal-media"></span>
            </div>
            <div id="modal-sleeve-row" class="meta-row" style="display:none">
              <span class="meta-label">Sleeve</span>
              <span id="modal-sleeve"></span>
            </div>
          </div>
          <p id="modal-price" class="modal-price"></p>
          <p id="modal-notes" class="modal-notes" style="display:none"></p>
          <div id="modal-actions" class="modal-actions"></div>
        </div>
      </div>
    </div>
  </div>

  <footer>
    <p>Elbo Records &mdash; San Diego, CA</p>
  </footer>

  <script src="js/app.js"></script>
</body>
</html>
