<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Elbo Records</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header>
    <div class="header-inner">
      <div class="logo">
        <span class="logo-mark">◈</span>
        <h1>Elbo Records</h1>
      </div>
      <p class="tagline">San Diego · Vinyl · Analog · Collectibles</p>
      <nav class="filters">
        <button class="filter-btn active" data-filter="all">All</button>
        <button class="filter-btn" data-filter="vinyl">Vinyl</button>
        <button class="filter-btn" data-filter="cds">CDs</button>
        <button class="filter-btn" data-filter="gear">Gear</button>
        <!-- <button class="filter-btn" data-filter="collectibles">Collectibles</button> -->
      </nav>
    </div>
  </header>

  <main>
    <div id="catalog-grid" class="catalog-grid"></div>
    <p id="empty-msg" class="empty-msg" style="display:none">No items found.</p>
  </main>

  <div id="modal-overlay" class="modal-overlay" aria-hidden="true">
    <div class="modal" role="dialog" aria-modal="true">
      <button class="modal-close" id="modal-close" aria-label="Close">&times;</button>
      <div class="modal-body">
        <div class="modal-image-wrap">
          <img id="modal-img" src="" alt="">
          <div id="modal-sold-badge" class="modal-sold-badge" style="display:none">SOLD</div>
        </div>
        <div class="modal-details">
          <p id="modal-format" class="modal-format"></p>
          <h2 id="modal-title"></h2>
          <p id="modal-artist" class="modal-artist"></p>
          <div class="modal-meta">
            <div id="modal-label-row" class="meta-row" style="display:none">
              <span class="meta-label">Label</span>
              <span id="modal-label"></span>
            </div>
            <div id="modal-year-row" class="meta-row" style="display:none">
              <span class="meta-label">Year</span>
              <span id="modal-year"></span>
            </div>
            <div id="modal-media-row" class="meta-row" style="display:none">
              <span class="meta-label">Media</span>
              <span id="modal-media"></span>
            </div>
            <div id="modal-sleeve-row" class="meta-row" style="display:none">
              <span class="meta-label">Sleeve</span>
              <span id="modal-sleeve"></span>
            </div>
          </div>
          <p id="modal-price" class="modal-price"></p>
          <p id="modal-notes" class="modal-notes" style="display:none"></p>
          <div id="modal-paypal" class="modal-paypal"></div>
        </div>
      </div>
    </div>
  </div>

  <footer>
    <p>Elbo Records &mdash; San Diego, CA</p>
  </footer>

  <script src="js/app.js"></script>
</body>
</html>
